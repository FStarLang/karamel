name: CI
on:
  push:
    branches-ignore:
    - _**
    - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      nocache:
        description: Do not reuse previous F*1 builds
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'

defaults:
  run:
    shell: bash

env:
  OCAML_VERSION: 5.3.0
  FRESH_FSTAR_BUILD: ${{ inputs.nocache || github.event_name == 'schedule' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup ocaml
        uses: ocaml/setup-ocaml@v3
        with:
           ocaml-compiler: ${{ env.OCAML_VERSION }}

      - uses: actions/checkout@master
        with:
          path: karamel

      - name: Resolve F*1 revision
        id: fstar
        run: |
          rev=$(git ls-remote --exit-code https://github.com/FStarLang/FStar.git refs/heads/fstar1 | cut -f1)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # Cache the standalone F* distribution, including its libraries and Z3.
      - name: Restore F*1 package
        id: fstar-cache
        uses: actions/cache/restore@v4
        with:
          path: fstar.tar.gz
          lookup-only: ${{ env.FRESH_FSTAR_BUILD == 'true' }}
          key: fstar1-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ steps.fstar.outputs.rev }}

      - name: Checkout F*1
        if: steps.fstar-cache.outputs.cache-hit != 'true' || env.FRESH_FSTAR_BUILD == 'true'
        uses: actions/checkout@master
        with:
          repository: FStarLang/FStar
          ref: ${{ steps.fstar.outputs.rev }}
          path: fstar-src

      - name: Build F*1 package
        if: steps.fstar-cache.outputs.cache-hit != 'true' || env.FRESH_FSTAR_BUILD == 'true'
        working-directory: fstar-src
        run: |
          opam install --deps-only ./fstar.opam
          eval "$(opam env)"
          make -j$(nproc) ADMIT=1 FSTAR_TAG= package
          mv fstar.tar.gz ../fstar.tar.gz

      - name: Save F*1 package
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: fstar.tar.gz
          key: ${{ steps.fstar-cache.outputs.cache-primary-key }}

      - name: Unpack F*1
        run: |
          tar -xzf fstar.tar.gz
          echo "$PWD/fstar/bin" >> "$GITHUB_PATH"
          echo "FSTAR_EXE=$PWD/fstar/bin/fstar.exe" >> "$GITHUB_ENV"
          ./fstar/bin/fstar.exe --version

      - name: Install KaRaMeL dependencies
        run: |
          # F* is supplied by the binary package above.
          sed '/^  "fstar"$/d' karamel/karamel.opam > "$RUNNER_TEMP/karamel.opam"
          opam install --deps-only "$RUNNER_TEMP/karamel.opam"

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Karamel CI
        working-directory: karamel
        run: |
          eval $(opam env)
          . $HOME/.cargo/env
          export OCAMLRUNPARAM=b
          make -kj$(nproc)
          make -kj$(nproc) -C test everything

      - name: Build book
        working-directory: karamel
        run: |
          eval $(opam env)
          sudo apt-get update
          sudo apt-get install -y python3-sphinx python3-sphinx-rtd-theme
          make -C book html

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          path: karamel/book/_build
          name: book

  # This is checked in parallel with no F* around. It checks that the
  # krllib snapshot builds, on several systems.
  build-krmllib:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-15
          - macos-26
        cc:
          - gcc
          - clang

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@master
      - name: Build the checked-in krmllib
        run: |
          export CC=${{matrix.cc}}
          export KRML_INCLUDEDIR=$(pwd)/include
          export KRML_LIBDIR=$(pwd)/krmllib
          make -kj$(nproc) -C krmllib/dist/generic -f Makefile.basic

  build-and-test-pulse:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with test/pulse/refresh.sh, and bump both together.
      FSTAR_VERSION: nightly-2026-10-18
    steps:
      - name: Setup ocaml
        uses: ocaml/setup-ocaml@v3
        with:
           ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Download F* nightly
        run: |
          curl -fL --retry 3 \
            "https://github.com/FStarLang/FStar-nightly/releases/download/${FSTAR_VERSION}/fstar-Linux-x86_64.tar.gz" \
            -o fstar.tar.gz
          tar -xzf fstar.tar.gz
          echo "$PWD/fstar/bin" >> "$GITHUB_PATH"
          echo "FSTAR_EXE=$PWD/fstar/bin/fstar.exe" >> "$GITHUB_ENV"
          ./fstar/bin/fstar.exe --version

      - uses: actions/checkout@master
        with:
          path: karamel

      - name: Install KaRaMeL dependencies
        run: |
          # F* is supplied by the binary package above.
          sed '/^  "fstar"$/d' karamel/karamel.opam > "$RUNNER_TEMP/karamel.opam"
          opam install --deps-only "$RUNNER_TEMP/karamel.opam"

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Karamel CI (test-pulse)
        working-directory: karamel
        run: |
          eval $(opam env)
          export OCAMLRUNPARAM=b
          make -kj$(nproc) test-pulse

  build-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Cache builds in this repository's GitHub Actions cache.
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: enabled
          use-flakehub: disabled

      - name: Build KaRaMeL and krmllib with F*
        run: nix build -L --no-link --no-write-lock-file .

  test-eurydice:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Cache Eurydice and its dependencies in this repository's GitHub Actions cache.
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: enabled
          use-flakehub: disabled

      - name: Build and test Eurydice against this Karamel
        run: |
          nix build -L --no-link \
            "github:AeneasVerif/eurydice#checks.x86_64-linux.default" \
            --override-input karamel "github:FStarLang/karamel/$GITHUB_SHA"

  # A single no-op job to use for branch protection
  ciok:
    runs-on: ubuntu-latest
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    needs:
      - build-and-test
      - build-and-test-pulse
      - build-krmllib
      - build-nix
      - test-eurydice
    steps:
      # Note: this only runs when a dependency fails. If they all succeed,
      # this jobs is skipped, which counts as a success.
      # https://github.com/actions/runner/issues/2566
      - run: exit 1

  publish_book:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build-and-test
    steps:
      - uses: actions/checkout@master
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: book/_build

      - name: Configure git
        run: |
          git config --global user.name "Dzomo, the Everest Yak"
          git config --global user.email "24394600+dzomo@users.noreply.github.com"

      - run: .scripts/publish_tutorial.sh
        env:
          DZOMO_GITHUB_TOKEN: ${{secrets.DZOMO_GITHUB_TOKEN}}
